<!doctype html>
<html lang="en">
  <head>

    <style>
      :root { --text: #f4f3ff; --muted: #a9abd9; --accent: #ffc845; --card: #242862; --line: #3a3f8c; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: linear-gradient(#1a1d45, #0e1030) fixed; color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
      h1 { font-size: 2.2rem; letter-spacing: 0.08em; margin: 0 0 6px; }
      .muted { color: var(--muted); }
      .card { margin-top: 32px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px 22px; }
      h2 { margin: 0 0 6px; }
      a { color: var(--accent); }
      ul { padding-left: 20px; }

        <p class="muted">Tap the arrows whose path is clear until the board is empty. Locks, ice, daily puzzles and shareable puzzle codes.</p>
        <ul>
          <li><a href="arrow-puzzle/privacy.html">Privacy Policy</a></li>
